name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"

      - name: Build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk FineVolume.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" FineVolume.apk \
            --title "音量微調 第 ${{ github.run_number }} 版" \
            --notes "在手機上下載 FineVolume.apk 安裝。可直接覆蓋舊版，設定會保留。" \
            --latest
